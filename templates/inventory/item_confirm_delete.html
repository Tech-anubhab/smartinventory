{% extends "base.html" %}

{% block title %}Delete item{% endblock %}

{% block content %}
  <h1>Delete item</h1>
  <p>Are you sure you want to delete <strong>{{ item.name }}</strong> ({{ item.sku }})?</p>

  <form method="post" class="mt-3">
    {% csrf_token %}
    <button type="submit" class="btn btn-danger">Yes, delete</button>
    <a href="{% url 'inventory_list' %}" class="btn btn-secondary">Cancel</a>
  </form>
{% endblock %}
