{% extends "base.html" %}

{% block title %}Sell{% endblock %}
{% block page_title %}Sell item{% endblock %}

{% block content %}
  <h5 class="mb-3">Sell {{ item.name }} ({{ item.sku }})</h5>
  <p class="text-muted mb-2">Current stock: {{ item.quantity }}</p>

  <form method="post" class="card-glass p-3">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit" class="btn btn-success">Record sell</button>
    <a href="{% url 'inventory_list' %}" class="btn btn-secondary">Cancel</a>
  </form>
{% endblock %}
