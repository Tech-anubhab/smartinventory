{% extends "base.html" %}

{% block title %}Login{% endblock %}

{% block content %}
  <h1 class="mb-3">Login</h1>

  <form method="post" class="card p-3">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit" class="btn btn-primary">Login</button>
    <a href="{% url 'register' %}" class="btn btn-link">Register</a>
  </form>
{% endblock %}
