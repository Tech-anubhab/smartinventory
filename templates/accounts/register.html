{% extends "auth_base.html" %}
{% load static %}

{% block title %}Register{% endblock %}

{% block content %}

<div class="auth-container">

<div class="auth-card">

<div class="logo">
<img src="{% static 'images/logo.jpeg' %}">
</div>

<div class="auth-title">
Create Account
</div>

<div class="auth-subtitle">
Join SmartInventory
</div>

<form method="POST">

{% csrf_token %}

<div class="form-group">
<input
type="text"
name="username"
placeholder=" "
class="form-control"
required>
<label class="form-label">
Username
</label>
</div>

<div class="form-group">
<input
type="email"
name="email"
placeholder=" "
class="form-control"
required>
<label class="form-label">
Email Address
</label>
</div>

<div class="form-group password-wrapper">

<input
type="password"
name="password1"
id="password1"
placeholder=" "
class="form-control"
required>

<label class="form-label">
Password
</label>

<button
type="button"
class="eye-btn"
onclick="togglePassword('password1','eye1')">

<i id="eye1"
class="fa-solid fa-eye"></i>

</button>

</div>

<div class="form-group password-wrapper">

<input
type="password"
name="password2"
id="password2"
placeholder=" "
class="form-control"
required>

<label class="form-label">
Confirm Password
</label>

<button
type="button"
class="eye-btn"
onclick="togglePassword('password2','eye2')">

<i id="eye2"
class="fa-solid fa-eye"></i>

</button>

</div>

<button type="submit" class="auth-btn">
Create Account
</button>

</form>

<div class="auth-link">
Already have an account?
<a href="{% url 'login' %}">
Login
</a>
</div>

</div>
</div>

<script>

function togglePassword(field,eye){

let password =
document.getElementById(field);

let icon =
document.getElementById(eye);

if(password.type==="password"){

password.type="text";

icon.classList.remove("fa-eye");
icon.classList.add("fa-eye-slash");

}else{

password.type="password";

icon.classList.remove("fa-eye-slash");
icon.classList.add("fa-eye");

}

}

</script>

{% endblock %}
