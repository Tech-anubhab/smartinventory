{% extends "base.html" %}

{% block title %}Register{% endblock %}

{% block content %}
  <h1 class="mb-3">Register</h1>

  <form method="post" class="card p-3">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit" class="btn btn-primary">Create account</button>
    <a href="{% url 'login' %}" class="btn btn-link">Login</a>
  </form>
{% endblock %}
